version: "3.9"
services:
  redis:
    image: redis:7
    ports: ["6379:6379"]

  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model /models/Qwen3-ASR-1.7B
      --served-model-name Qwen/Qwen3-ASR-1.7B
      --host 0.0.0.0 --port 8001
      --gpu-memory-utilization 0.9
      --max-num-seqs 8
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  api:
    build: .
    env_file: .env
    command: ["api"]
    depends_on: [redis]
    ports: ["8000:8000"]
    volumes:
      - ./models:/models

  worker:
    build: .
    env_file: .env
    command: ["worker"]
    depends_on: [redis]
    volumes:
      - ./models:/models
