# ============================================================
# docker-compose.yml (선택사항)
#
# 기본 사용법은 올인원 이미지입니다:
#   docker build -t qwen3-stt .
#   docker run --gpus all --env-file .env -v ./models:/models -p 8000:8000 qwen3-stt
#
# 멀티 노드/GPU 분리가 필요한 경우에만 이 compose를 사용하세요:
#   docker compose --profile dev up     → 0.6B
#   docker compose --profile prod up    → 1.7B
# ============================================================
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # ── 개발용: 0.6B 모델 ─────────────────────────────────────
  vllm-dev:
    image: qwenllm/qwen3-asr:latest
    profiles: ["dev"]
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    command:
      - qwen-asr-serve
      - /models/Qwen3-ASR-0.6B
      - --served-model-name
      - Qwen/Qwen3-ASR-0.6B
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --gpu-memory-utilization
      - "0.85"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "4"
      - --enforce-eager
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # ── 프로덕션: 1.7B 모델 ───────────────────────────────────
  vllm-prod:
    image: qwenllm/qwen3-asr:latest
    profiles: ["prod"]
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    command:
      - qwen-asr-serve
      - /models/Qwen3-ASR-1.7B
      - --served-model-name
      - Qwen/Qwen3-ASR-1.7B
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "32"
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # compose 사용시 API: .env에서 REDIS_URL과 VLLM_BASE_URL을 서비스명으로 설정
  # 예: REDIS_URL=redis://redis:6379/0, VLLM_BASE_URL=http://vllm-dev:8001
  api:
    build: .
    env_file: .env
    # compose 모드에서는 entrypoint의 Redis/vLLM 기동을 스킵
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
      - ./data:/app/data
