services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  vllm:
    image: vllm/vllm-openai:latest
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    command:
      - /models/Qwen3-ASR-1.7B
      - --served-model-name
      - Qwen/Qwen3-ASR-1.7B
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --gpu-memory-utilization
      - "0.80"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "1"
      - --enforce-eager
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  api:
    build: .
    env_file: .env
    command: ["api"]
    depends_on:
      redis:
        condition: service_started
      vllm:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  worker:
    build: .
    env_file: .env
    command: ["worker"]
    depends_on:
      redis:
        condition: service_started
      vllm:
        condition: service_healthy
    volumes:
      - ./models:/models
