[project]
name = "gpu-stt-service"
version = "0.1.0"
description = "Integrated GPU STT + diarization service with WS/REST APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "redis>=5.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "soundfile>=0.12.1",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "python-multipart>=0.0.9",
  "orjson>=3.10.0",
  "ulid-py>=1.1.0",
  "resampy>=0.4.3",
  "webrtcvad-wheels>=2.0.14",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
